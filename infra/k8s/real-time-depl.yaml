apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  namespace: stock-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      containers:
        - name: realtime-service
          image: goodmanisltd/td-realtime-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: realtime-secrets
            - configMapRef:
                name: realtime-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
  namespace: stock-tracker
spec:
  selector:
    app: realtime-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
